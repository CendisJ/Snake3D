<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101d;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
header{text-align:center;padding:12px;font-size:26px;font-weight:900;color:#63ff9a;text-shadow:0 0 15px #00ff80}
#stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:5px}
.stat{background:#14263a;border:1px solid #29435d;border-radius:12px;padding:8px 13px;font-weight:bold}
#game{display:block;width:min(94vw,560px);height:min(94vw,560px);max-height:58vh;margin:12px auto;background:#102337;border:3px solid #31516b;border-radius:18px;box-shadow:0 0 30px #00a66a55;touch-action:none}
#controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:5px}
button{background:linear-gradient(135deg,#20c878,#087d55);border:0;border-radius:12px;padding:12px 16px;color:white;font-weight:bold;font-size:14px;box-shadow:0 4px 0 #064d38}
button:active{transform:translateY(3px);box-shadow:none}
#joystick{width:120px;height:120px;border-radius:50%;background:#263c50;border:3px solid #58748b;margin:12px auto;position:relative;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:linear-gradient(135deg,#73ffb0,#00a65d);box-shadow:0 0 18px #00ff91;pointer-events:none}
#message{position:absolute;top:45%;left:0;right:0;text-align:center;font-size:25px;font-weight:bold;text-shadow:0 2px 8px black;pointer-events:none}
</style>
</head>
<body>
<header>🐍 SNAKE 3D</header>
<div id="stats">
 <div class="stat">⭐ Skóre: <span id="score">0</span></div>
 <div class="stat">🏆 Best: <span id="best">0</span></div>
 <div class="stat">🪙 Peníze: <span id="money">0</span></div>
</div>
<div style="position:relative">
 <canvas id="game" width="600" height="600"></canvas>
 <div id="message"></div>
</div>
<div id="controls">
 <button onclick="togglePause()">⏸ Pauza</button>
 <button onclick="restart()">🔄 Restart</button>
 <button onclick="buySpeed()">⚡ Rychlost (<span id="speedCost">50</span>)</button>
 <button onclick="buyIncome()">🪙 Příjem (<span id="incomeCost">100</span>)</button>
</div>
<div id="joystick"><div id="stick"></div></div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const size=30;
let snake,foods,score,money,best;
let direction={x:1,y:0},nextDirection={x:1,y:0};
let paused=false,dead=false,speedLevel=0,incomeLevel=0;
let lastTime=0,progress=0;
best=Number(localStorage.getItem("snakeBest")||0);
function restart(){
 snake=[{x:10,y:15},{x:9,y:15},{x:8,y:15},{x:7,y:15},{x:6,y:15}];
 direction={x:1,y:0};nextDirection={x:1,y:0};
 score=0;money=0;paused=false;dead=false;progress=0;
 foods=[];makeFood();document.getElementById("message").textContent="";updateUI();
}
function makeFood(){
 const types=["red","blue","gold"];
 foods=foods||[];
 while(foods.length<5){
  let candidate;
  do{
   candidate={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size),type:types[Math.floor(Math.random()*3)]};
  }while(snake.some(s=>s.x===candidate.x&&s.y===candidate.y)||foods.some(f=>f.x===candidate.x&&f.y===candidate.y));
  foods.push(candidate);
 }
}
function updateUI(){
 document.getElementById("score").textContent=score;
 document.getElementById("best").textContent=best;
 document.getElementById("money").textContent=money;
 document.getElementById("speedCost").textContent=50*(speedLevel+1);
 document.getElementById("incomeCost").textContent=100*(incomeLevel+1);
}
function buySpeed(){let cost=50*(speedLevel+1);if(money>=cost){money-=cost;speedLevel++;updateUI();}}
function buyIncome(){let cost=100*(incomeLevel+1);if(money>=cost){money-=cost;incomeLevel++;updateUI();}}
function togglePause(){if(dead)return;paused=!paused;document.getElementById("message").textContent=paused?"PAUZA":"";}
function setDirection(x,y){if(x===-direction.x&&y===-direction.y)return;nextDirection={x,y};}
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")setDirection(0,-1);
 if(e.key==="ArrowDown"||e.key==="s")setDirection(0,1);
 if(e.key==="ArrowLeft"||e.key==="a")setDirection(-1,0);
 if(e.key==="ArrowRight"||e.key==="d")setDirection(1,0);
 if(e.code==="Space")togglePause();
});
const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");
let joyActive=false;
function moveJoy(e){
 const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,length=Math.hypot(dx,dy),max=35;
 if(length>max){dx=dx/length*max;dy=dy/length*max;}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 if(Math.hypot(dx,dy)>12){
  if(Math.abs(dx)>Math.abs(dy))setDirection(Math.sign(dx),0);
  else setDirection(0,Math.sign(dy));
 }
}
joystick.addEventListener("pointerdown",e=>{joyActive=true;joystick.setPointerCapture(e.pointerId);moveJoy(e);});
joystick.addEventListener("pointermove",e=>{if(joyActive)moveJoy(e);});
function endJoy(){joyActive=false;stick.style.transform="translate(0,0)";}
joystick.addEventListener("pointerup",endJoy);joystick.addEventListener("pointercancel",endJoy);
function die(){dead=true;document.getElementById("message").textContent="KONEC HRY!";}
function update(){
 direction=nextDirection;
 const head={x:(snake[0].x+direction.x+size)%size,y:(snake[0].y+direction.y+size)%size};
 const foodIndex=foods.findIndex(f=>f.x===head.x&&f.y===head.y);
 const eating=foodIndex!==-1,body=eating?snake:snake.slice(0,-1);
 if(body.some(s=>s.x===head.x&&s.y===head.y)){die();return;}
 snake.unshift(head);
 if(eating){
  const eaten=foods.splice(foodIndex,1)[0];
  score+=eaten.type==="gold"?5:eaten.type==="blue"?3:1;
  money+=(eaten.type==="gold"?10:eaten.type==="blue"?5:2)*(incomeLevel+1);
  if(score>best){best=score;localStorage.setItem("snakeBest",best);}
  makeFood();updateUI();
 }else snake.pop();
}
function circle(x,y,r,color){
 const g=ctx.createRadialGradient(x-r*.35,y-r*.4,2,x,y,r);
 g.addColorStop(0,"white");g.addColorStop(.25,color);g.addColorStop(1,"#07101d");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function draw(){
 ctx.clearRect(0,0,600,600);ctx.fillStyle="#102337";ctx.fillRect(0,0,600,600);
 ctx.strokeStyle="#ffffff0b";ctx.lineWidth=1;
 for(let i=0;i<=600;i+=20){
  ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,600);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(600,i);ctx.stroke();
 }
 const colors={red:"#ff405e",blue:"#36bfff",gold:"#ffd447"};
 for(const food of foods)circle(food.x*20+10,food.y*20+10,9,colors[food.type]);
 for(let i=snake.length-1;i>=0;i--){
  const s=snake[i],x=s.x*20+10,y=s.y*20+10;
  circle(x,y,i===0?10:9,i===0?"#68ff9b":"#19d978");
  if(i===0){ctx.fillStyle="#062d1b";ctx.beginPath();ctx.arc(x-3,y-2,1.8,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+3,y-2,1.8,0,7);ctx.fill();}
 }
}
function loop(time){
 const dt=Math.min(time-lastTime,50);lastTime=time;
 if(!paused&&!dead){
  const interval=Math.max(100,500-speedLevel*35);
  progress+=dt;if(progress>=interval){progress-=interval;update();}
 }
 draw();requestAnimationFrame(loop);
}
restart();requestAnimationFrame(loop);
</script>
</body>
</html>
